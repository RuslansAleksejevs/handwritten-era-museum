name: Verify collection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify code and local links
        run: make check
  mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        implementation: [mpich, openmpi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MPI and oracle dependency
        run: |
          sudo apt-get update
          if [ "${{ matrix.implementation }}" = mpich ]; then
            sudo apt-get install -y mpich libmpich-dev
          else
            sudo apt-get install -y openmpi-bin libopenmpi-dev
          fi
          python -m pip install 'numpy>=1.26'
      - name: Check distributed code and UBSan
        env:
          MPIEXEC_FLAGS: ${{ matrix.implementation == 'openmpi' && '--oversubscribe' || '' }}
          MPICXX: ${{ matrix.implementation == 'mpich' && 'mpicxx.mpich' || 'mpicxx.openmpi' }}
          MPIEXEC: ${{ matrix.implementation == 'mpich' && 'mpiexec.mpich' || 'mpiexec.openmpi' }}
        run: |
          "$MPIEXEC" --version
          make mpi-check
          make mpi-sanitize
